<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher Web</title>
</head>
<body style="font-family: Arial; padding: 30px;">
    <h2>CAESAR CIPHER - WEB DEMO</h2>
    
    <!-- Form Mã Hóa -->
    <fieldset style="width: 400px; margin-bottom: 20px; padding: 15px;">
        <legend><b>Mã hóa (Encrypt)</b></legend>
        <form method="POST" action="/caesar/encrypt">
            <label>Plain text:</label><br>
            <input type="text" name="inputPlainText" required style="width: 350px; padding: 5px;"><br><br>
            <label>Key:</label><br>
            <input type="number" name="inputKeyPlain" required style="width: 350px; padding: 5px;"><br><br>
            <button type="submit" style="padding: 8px 15px;">Encrypt</button>
        </form>
    </fieldset>

    <!-- Form Giải Mã -->
    <fieldset style="width: 400px; padding: 15px;">
        <legend><b>Giải mã (Decrypt)</b></legend>
        <form method="POST" action="/caesar/decrypt">
            <label>Cipher text:</label><br>
            <input type="text" name="inputCipherText" required style="width: 350px; padding: 5px;"><br><br>
            <label>Key:</label><br>
            <input type="number" name="inputKeyCipher" required style="width: 350px; padding: 5px;"><br><br>
            <button type="submit" style="padding: 8px 15px;">Decrypt</button>
        </form>
    </fieldset>
    
    <br><a href="/">Quay lại trang chủ</a>
</body>
</html>
